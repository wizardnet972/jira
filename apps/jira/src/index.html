<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jira</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      document.documentElement.classList.toggle(
        'dark',
        localStorage.getItem('jira-theme') === 'dark' ||
          (!localStorage.getItem('jira-theme') && matchMedia('(prefers-color-scheme: dark)').matches)
      );
    </script>
  </head>
  <body>
    <jira-root></jira-root>
  </body>
</html>
