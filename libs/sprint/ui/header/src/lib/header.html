<header class="flex items-start justify-between gap-4">
  <div>
    <h2 class="m-0 text-xl font-semibold text-jira-navy">{{ name() }}</h2>
    <p class="m-0 mt-1 text-[13px] text-jira-muted">{{ goal() }}</p>
  </div>
  <div class="flex items-center gap-3 text-[13px] text-jira-muted">
    <span class="rounded px-1.5 py-0.5 text-[11px] font-semibold capitalize" [class]="state() === 'active' ? 'bg-jira-chip-green text-jira-chip-green-fg' : 'bg-jira-column text-jira-muted'">{{ state() }}</span>
    <span>{{ range() }}</span>
    <span>{{ remainingDays() }} days left</span>
  </div>
</header>
